name: Morning news V1.3

on:
  schedule:
    # UTC: 01:00 = 08:00 and 06:30 = 13:30 in Vietnam (UTC+07:00).
    - cron: '0 1 * * *'
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morning-news-production
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install free dependencies
        run: python -m pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Update live information
        env:
          PYTHONUTF8: '1'
        run: |
          if python src/main.py --no-publish; then
            echo 'Pipeline PASS'
          else
            result=$?
            if [ "$result" -eq 2 ]; then
              echo 'Pipeline PARTIAL; publish retained available data'
            else
              exit "$result"
            fi
          fi
      - name: Commit and push generated files
        run: python src/cloud_publish.py
