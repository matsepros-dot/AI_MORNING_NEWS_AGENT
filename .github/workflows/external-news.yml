name: Morning news external scheduler (standby)

on:
  workflow_dispatch:
    inputs:
      source:
        description: Scheduler label (GitHub API authentication is still required)
        required: true
        type: choice
        options:
          - cron-job.org
      requested_at:
        description: Unix timestamp supplied by cron-job.org
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: morning-news-production
  cancel-in-progress: false

jobs:
  schedule-policy:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.policy.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
      - name: Check date and allowed update window
        id: policy
        run: python3 scripts/external_schedule_policy.py
  update-news:
    needs: schedule-policy
    if: needs.schedule-policy.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install free dependencies
        run: python -m pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Recheck window before fetching
        id: fetch-window
        run: python scripts/external_schedule_policy.py
      - name: Update live information
        if: steps.fetch-window.outputs.allowed == 'true'
        env:
          PYTHONUTF8: '1'
        run: |
          if python src/main.py --no-publish; then
            echo 'Pipeline PASS'
          else
            result=$?
            if [ "$result" -eq 2 ]; then
              echo 'Pipeline PARTIAL; publish retained available data'
            else
              exit "$result"
            fi
          fi
      - name: Recheck window before publishing
        id: publish-window
        if: steps.fetch-window.outputs.allowed == 'true'
        run: python scripts/external_schedule_policy.py
      - name: Commit and push generated files
        if: steps.publish-window.outputs.allowed == 'true'
        run: python src/cloud_publish.py
